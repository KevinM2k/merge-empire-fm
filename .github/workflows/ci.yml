name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Unit and widget tests need no Apple toolchain — iOS builds get their own
    # macOS job when M7 adds the release pipeline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
