name: CI

on:
  push:
  pull_request:

jobs:
  analyze:
    # Analyze only. The suite runs locally before a tag; see docs/RELEASE.md §5.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: the framework's own assertions move between minors. Keep with .fvmrc.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
