include: package:flutter_lints/flutter.yaml

analyzer:
  # Xcode checks Firebase's Swift packages out under build/, Dart tests and all.
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - avoid_print
    - unawaited_futures
