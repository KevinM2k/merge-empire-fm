name: merge_empire_fc
description: "Merge Empire Football Manager"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# **ABOVE THE SHIPPED APP'S, and this is not cosmetic.** Play refuses an upload
# whose versionCode is not higher than the live one, and the App Store the same
# for CFBundleVersion — so `1.0.0+1`, which is what `flutter create` writes,
# could not have been uploaded at all. The live build is versionCode 10112 /
# versionName 1.1.12 (`../merge-empire-fc/android/app/build.gradle`).
#
# The scheme is the shipped app's own: major*10000 + minor*100 + patch. 1.2.0
# because a whole reimplementation is not a patch release, and because it leaves
# the 1.1.x line free for anything the old build still has to ship.
# Pinned by `test/native_version_test.dart`.
version: 1.2.0+10200

environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Material's own widget strings, and the RTL Directionality Arabic needs. Our
  # catalogue is generated — see lib/i18n.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flame: ^1.35.1
  audioplayers: ^6.7.1

  # The platform seams the JS reaches for through Capacitor. Each is behind one
  # small file in lib/services and nothing else in the app imports the plugin —
  # which is what lets a test replace the seam rather than the platform.
  url_launcher: ^6.3.2 # utils/openUrl.js — @capacitor/browser
  wakelock_plus: ^1.6.1 # utils/wakeLock.js — the Screen Wake Lock API
  connectivity_plus: ^7.3.1 # utils/network.js — navigator.onLine
  in_app_review: ^2.0.12 # engine/ratingEngine.js — @capacitor-community/in-app-review
  flutter_local_notifications: ^22.3.0 # main.js's four — @capacitor/local-notifications
  timezone: ^0.11.1 # its own transitive, named because notifications.dart imports it
  google_mobile_ads: ^6.0.0 # engine/energyEngine.js's units — @capacitor-community/admob
  # **iOS ONLY, and it is the ad stack's other half.** `google_mobile_ads`
  # carries UMP, which answers the EEA's consent question; Apple's is a separate
  # prompt with a separate API and no plugin exposes it, so without this one
  # `NSUserTrackingUsageDescription` sits in Info.plist and is never read. A
  # no-op on Android, where there is no such prompt.
  app_tracking_transparency: ^2.0.7
  # services/authService.js — @capacitor-firebase/authentication. Both hand back
  # an OAuth id_token; the Firebase session is minted from it over REST.
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7 # the SHA-256 Apple's nonce is hashed with
  in_app_purchase: ^3.3.0 # engine/iapClient.js — cordova-plugin-purchase
  # utils/analytics.js — @capacitor-firebase/analytics and /crashlytics. The one
  # place the port DOES take the Firebase SDK: a crash reporter has to be native
  # (it catches the process dying), and analytics has no REST route without a
  # console-generated Measurement Protocol secret. Firestore and Auth still go
  # over plain HTTPS — see data/firebase_config.dart.
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7


dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # The debounced save runs on a Timer, so the tests that assert WHEN a write
  # lands drive the clock rather than waiting on it.
  fake_async: ^1.3.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # google_mobile_ads is CocoaPods-only and clashes with SPM plugins; 3.44 defaults SPM on.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Bundled so the on-device migration probe can load a real v7 save.
    - test/fixtures/default_save_v7.json

    # The shipped artwork, lifted from the old repo's public/. The generated
    # SVG in lib/data is the FALLBACK for these, not the other way round —
    # see lib/data/art_paths.dart.
    - assets/players/
    - assets/club/
    - assets/bg/
    - assets/bg/kenney/
    - assets/trophies/
    - assets/penalty/
    - assets/whack/
    - assets/ui/
    - assets/audio/

    # Colin's voice, and there may be nothing in it. **A folder per locale, one
    # file per catalogue key** — `voice/en/coachtip.foo.mp3` — read through the
    # asset manifest, so dropping a clip in is the whole of adding a spoken
    # line and shipping none leaves him silent. He used to read himself out
    # with the device's own speech engine; that plugin is gone.
    # See services/voice_service.dart.
    - assets/voice/

    # Kenney's top-down sports pack (CC0), for the 2D match cutaway.
    - assets/pitch/

    # Eight frames of Kenney's white smoke puff (CC0), trimmed to their alpha
    # box and down to 128px — 140KB of the pack's 5.9MB. The merge burst stays
    # procedural, because it has to draw in any tier's colour at any size and a
    # sprite sheet cannot; this is for the things that had no effect at all.
    - assets/fx/

    # Kenney's modular character pack (CC0), extracted from
    # `kenneynl/kenney_modular-characters`. A layered paper doll — head, neck,
    # arm, hand and leg per skin tint, shirts with their own sleeve lengths,
    # pants, shoes, hair and face features — which is exactly the shape
    # `manager_walker.dart`'s rig already draws: it turns joints, so giving it
    # real parts to turn is a swap rather than a rewrite. It is also every
    # preview the customiser's style boxes need.
    #
    # Only the PNG tree is bundled, flattened one directory per layer: the pack
    # also ships vectors, spritesheets, a preview and a licence, and none of
    # those belong in an app. 1.8MB for 428 parts.
    - assets/manager/skin/
    - assets/manager/face/
    - assets/manager/hair/
    - assets/manager/shirts/
    - assets/manager/pants/
    - assets/manager/shoes/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
